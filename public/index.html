<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Voice & Text Chat</title>
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }

    /* === PREMIUM LOGIN MODAL (Glassmorphism) === */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.125);
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 360px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .avatar-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .login-card h3 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .login-card input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      background: rgba(15, 23, 42, 0.8);
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .login-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
    }

    /* === CHAT INTERFEYSI === */
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      display: none;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .header {
      padding: 18px 20px;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .copy-btn {
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    #chat-box {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      align-self: flex-start;
      word-wrap: break-word;
    }

    .message.my-message {
      align-self: flex-end;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
    }

    .user-name {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }

    .my-message .user-name {
      color: #e0e7ff;
    }

    .controls {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .controls input {
      flex-grow: 1;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      outline: none;
    }

    .send-btn,
    .record-btn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .send-btn {
      background: #6366f1;
      color: white;
    }

    .record-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .record-btn.recording {
      background: #ef4444;
      color: white;
      animation: pulse 1.5s infinite;
    }

    audio {
      margin-top: 6px;
      height: 36px;
      max-width: 220px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
  </style>
</head>

<body>

  <!-- PREMIUM LOGIN MODAL -->
  <div id="login-modal" class="login-overlay">
    <div class="login-card">
      <div class="avatar-icon">💬</div>
      <h3>Xush kelibsiz!</h3>
      <p>Suhbatni boshlash uchun ismingizni kiriting</p>

      <div class="input-group">
        <input type="text" id="username-field" placeholder="Ismingiz..." autocomplete="off" />
      </div>

      <button onclick="saveNameAndJoin()">Chatga kirish</button>
    </div>
  </div>

  <!-- MAIN CHAT APP -->
  <div id="chat-app" class="chat-container">
    <div class="header">
      <div class="header-user">
        <div class="status-dot"></div>
        <div>
          <span style="font-size: 14px; font-weight: 600;" id="display-username">--</span>
          <span style="display: block; font-size: 11px; color: #94a3b8;">Online</span>
        </div>
      </div>
      <button class="copy-btn" onclick="copyLink()">🔗 Linkni nusxalash</button>
    </div>

    <div id="chat-box"></div>

    <div class="controls">
      <input type="text" id="message-input" placeholder="Xabaringizni yozing..." />
      <button class="send-btn" onclick="sendMessage()">Yuborish</button>
      <button id="record-btn" class="record-btn" onclick="toggleRecording()">🎤</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // URL parametrlaridan Room ID olish
    const urlParams = new URLSearchParams(window.location.search);
    let room = urlParams.get('room');
    if (!room) {
      room = Math.random().toString(36).substring(2, 9);
      window.history.replaceState({}, '', `?room=${room}`);
    }

    const loginModal = document.getElementById('login-modal');
    const chatApp = document.getElementById('chat-app');
    const usernameField = document.getElementById('username-field');
    const displayUsername = document.getElementById('display-username');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const recordBtn = document.getElementById('record-btn');

    let currentUser = localStorage.getItem('chat_username');

    window.onload = () => {
      if (currentUser) {
        startChat(currentUser);
      }
    };

    function saveNameAndJoin() {
      const inputName = usernameField.value.trim();
      if (!inputName) return alert("Iltimos, ismingizni kiriting!");

      localStorage.setItem('chat_username', inputName);
      currentUser = inputName;
      startChat(inputName);
    }

    function startChat(name) {
      loginModal.style.display = 'none';
      chatApp.style.display = 'flex';
      displayUsername.innerText = name;
      socket.emit('joinRoom', { user: name, room });
    }

    // Enter tugmasi orqali logindan o'tish
    usernameField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveNameAndJoin();
    });

    // Eski xabarlar tarixini yuklash
    socket.on('chatHistory', (messages) => {
      chatBox.innerHTML = '';
      messages.forEach(appendMessage);
    });

    // Yangi xabarlarni qabul qilish
    socket.on('message', appendMessage);

    function appendMessage(data) {
      const msgElement = document.createElement('div');
      const isMe = data.user === currentUser;

      msgElement.classList.add('message');
      if (isMe) msgElement.classList.add('my-message');

      let content = `<span class="user-name">${isMe ? 'Siz' : data.user}</span>`;

      if (data.audio) {
        content += `<audio controls src="${data.audio}"></audio>`;
      } else {
        content += `<div>${data.text}</div>`;
      }

      msgElement.innerHTML = content;
      chatBox.appendChild(msgElement);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== '') {
        socket.emit('chatMessage', { user: currentUser, text, room });
        messageInput.value = '';
      }
    }

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Ovoz yozish mantiqlari
    let mediaRecorder, audioChunks = [], isRecording = false;

    async function toggleRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              socket.emit('chatMessage', { user: currentUser, audio: reader.result, room });
            };
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.innerText = "⏹️";
          recordBtn.classList.add('recording');
        } catch (err) {
          alert("Mikrofon ishlamadi yoki ruxsat berilmadi!");
        }
      } else {
er
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        recordBtn.innerText = "🎤";
        recordBtn.classList.remove('recording');
      }
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Xona havolasi nusxalandi!");
    }
  </script>
</body>

</htm
